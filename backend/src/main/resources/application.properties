# ==========================================
# SERVER
# ==========================================
# Railway injects PORT automatically. Locally it falls back to 8080.
server.port=${PORT:8080}
spring.application.name=smarttask-backend
# Needed behind Railway's HTTPS proxy so Swagger and redirects use https
server.forward-headers-strategy=framework

# ==========================================
# MYSQL DATABASE (Aiven)
# Preferred names: DBURL, DBUSERNAME, DBPASSWORD
# Also accepted:   DB_URL, DB_USERNAME, DB_PASSWORD
# DBURL format: jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED
# ==========================================
spring.datasource.url=${DBURL:${DB_URL}}
spring.datasource.username=${DBUSERNAME:${DB_USERNAME}}
spring.datasource.password=${DBPASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the pool small (Aiven free tier has a low connection limit)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# JWT AUTHENTICATION
# Preferred names: JWTSECRET, JWTEXPIRATIONMS
# Also accepted:   JWT_SECRET, JWTEXPIRATION_MS
# JWTSECRET must be at least 32 characters
# ==========================================
jwt.secret=${JWTSECRET:${JWT_SECRET}}
jwt.expiration-ms=${JWTEXPIRATIONMS:${JWTEXPIRATION_MS:86400000}}

# ==========================================
# CORS
# Comma-separated frontend origins, no trailing slash
# e.g. https://your-app.vercel.app
# ==========================================
app.cors.allowed-origins=${CORSALLOWEDORIGINS:http://localhost:5173}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework=INFO
logging.level.com.smarttask=INFO