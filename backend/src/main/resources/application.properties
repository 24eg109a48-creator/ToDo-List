server:
  port: ${PORT:10000}

spring.application.name=smarttask-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWTSECRET}
  expiration-ms: ${JWTEXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORSALLOWEDORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    # SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-s
logging.level.org.springframework.boot.context.config=TRACE
app.cors.allowed-origins=${CORSALLOWEDORIGINS:http://localhost:5173}
