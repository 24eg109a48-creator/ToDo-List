# ===================================================================
# Server & Application Configuration
# ===================================================================
server.port=${PORT:10000}
spring.application.name=smarttask-backend

# ===================================================================
# Database Configuration (MySQL - Aiven)
# Set DB_URL, DB_USERNAME, and DB_PASSWORD in Render
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================================================
# Security & JWT Configuration
# Set JWT_SECRET in Render before deploying
# ===================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS Configuration
# Set CORS_ALLOWED_ORIGINS to your deployed frontend URL
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===================================================================
# Swagger / OpenAPI Documentation
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
