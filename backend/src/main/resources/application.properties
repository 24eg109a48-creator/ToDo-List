# ------------------------------------------------------------------
# SmartTask backend configuration
# Values like ${DB_PASSWORD:} mean: "use the environment variable DB_PASSWORD,
# and if it is not set, use the default after the colon".
# ------------------------------------------------------------------
server.port=8080
spring.application.name=smarttask-backend

# ---- MySQL ----
# The database is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smarttask_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# Change JWT_SECRET for any real deployment (must be at least 32 characters).
jwt.secret=${JWT_SECRET:smarttask-development-only-secret-key-change-me-0123456789}
# Token lifetime in milliseconds (default: 24 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
# Comma-separated list of frontend origins that may call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
