# Test configuration: uses an in-memory H2 database, so MySQL is NOT needed to run "mvn test".
spring.datasource.url=jdbc:h2:mem:smarttask_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-for-unit-tests-only-0123456789abcdef
jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173
